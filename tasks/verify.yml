---
# Read-only verification. It never restarts the daemon and never prunes
# containers: a second role run must report zero changed tasks.

- name: Read the managed daemon configuration
  ansible.builtin.slurp:
    src: "{{ docker_daemon_config_path }}"
  register: docker_managed_daemon_config

- name: Assert the managed daemon configuration is valid JSON
  ansible.builtin.assert:
    that:
      - docker_managed_daemon_config.content | b64decode | from_json is mapping
    fail_msg: "{{ docker_daemon_config_path }} is not a JSON object"
    quiet: true

- name: Assert the systemd drop-in is present
  ansible.builtin.stat:
    path: "{{ docker_systemd_dropin_path }}"
  register: docker_dropin_stat

- name: Assert the systemd drop-in exists
  ansible.builtin.assert:
    that:
      - docker_dropin_stat.stat.exists | bool
      - docker_dropin_stat.stat.isreg | bool
    fail_msg: "the systemd drop-in {{ docker_systemd_dropin_path }} is missing"
    quiet: true

- name: Show the Docker client version
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false

- name: Display the Docker version
  ansible.builtin.debug:
    var: docker_version.stdout

- name: Check the Docker daemon is reachable
  ansible.builtin.command:
    cmd: docker info
  register: docker_info
  changed_when: false
  failed_when: false
  when: docker_verify_runtime | bool

- name: Display the Docker daemon status
  ansible.builtin.debug:
    msg: >-
      Docker installation
      {{ 'successful' if (docker_info.rc | default(1)) == 0 else 'installed, daemon not reachable' }}
  when: docker_verify_runtime | bool
