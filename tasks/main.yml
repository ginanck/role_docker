---
# tasks file for role-docker

- name: Include Docker installation tasks
  ansible.builtin.include_tasks: "install_{{ ansible_os_family | lower }}.yml"

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users | length > 0

# Fail before touching the daemon: TCP without TLS is an unauthenticated root
# equivalent control socket.
- name: Validate the requested daemon exposure
  ansible.builtin.include_tasks: preflight.yml

- name: Configure the Docker daemon
  ansible.builtin.include_tasks: configure.yml

- name: Verify Docker configuration and runtime
  ansible.builtin.include_tasks: verify.yml
